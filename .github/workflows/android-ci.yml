name: ArbeitsKlar Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
          dependency-graph: generate-and-submit
      - name: Validate native Android release
        run: |
          test "$(grep -c 'applicationId = "de.kamilunavo.arbeitsklar"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionName = "1.0.1"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionCode = 4' android/app/build.gradle.kts)" -eq 1
          ! grep -R -E -i "webview|loadurl|localhost" android/app/src/main
      - name: Unit tests
        run: gradle -p android testDebugUnitTest
      - name: Debug bundle
        run: gradle -p android bundleDebug
      - name: Release bundle
        run: gradle -p android bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: arbeitsklar-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
