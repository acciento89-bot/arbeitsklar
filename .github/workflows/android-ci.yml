name: ArbeitsKlar Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - "store/google-play/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "store/google-play/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
          dependency-graph: generate-and-submit
      - name: Validate native Android release identity
        run: |
          set -euo pipefail
          test "$(grep -c 'applicationId = "de.kamilunavo.arbeitsklar"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionName = "1.0.3"' android/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionCode = 6' android/app/build.gradle.kts)" -eq 1
          grep -Fq 'android:icon="@drawable/arbeitsklar_store_icon"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/arbeitsklar_store_icon"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'store/google-play/icon-512.png' android/app/build.gradle.kts
          test -s store/google-play/icon-512.png
          ! grep -R -E -i "webview|loadurl|localhost" android/app/src/main
      - name: Verify launcher/store icon parity
        run: gradle -p android verifyLauncherIconParity
      - name: Unit tests
        run: gradle -p android testDebugUnitTest
      - name: Debug bundle
        run: gradle -p android bundleDebug
      - name: Release bundle
        run: gradle -p android bundleRelease
      - name: Verify generated launcher is byte-identical to Play icon
        run: |
          set -euo pipefail
          GENERATED='android/app/src/main/res/drawable-nodpi/arbeitsklar_store_icon.png'
          test -s "$GENERATED"
          cmp -s store/google-play/icon-512.png "$GENERATED"
          sha256sum store/google-play/icon-512.png "$GENERATED"
      - uses: actions/upload-artifact@v4
        with:
          name: ArbeitsKlar-1.0.3-6-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
