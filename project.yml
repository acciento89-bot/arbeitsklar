name: ArbeitsKlar
options:
  bundleIdPrefix: de.kamilunavo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: TKG684N5GL
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  ArbeitsKlar:
    type: application
    platform: iOS
    sources:
      - path: ArbeitsKlar
        excludes:
          - Resources
          - Supporting/Info.plist
    resources:
      - path: ArbeitsKlar/Resources
    info:
      path: ArbeitsKlar/Supporting/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.arbeitsklar
        PRODUCT_NAME: ArbeitsKlar
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: ArbeitsKlarLiveActivity
        embed: true
  ArbeitsKlarLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ArbeitsKlarLiveActivity
        excludes:
          - Info.plist
      - path: ArbeitsKlar/Models/WorkActivityAttributes.swift
      - path: ArbeitsKlar/Utilities/WorkDurationFormatter.swift
    resources:
      - path: ArbeitsKlar/Resources/Localizable.xcstrings
    info:
      path: ArbeitsKlarLiveActivity/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kamilunavo.arbeitsklar.liveactivity
        PRODUCT_NAME: ArbeitsKlarLiveActivity
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
